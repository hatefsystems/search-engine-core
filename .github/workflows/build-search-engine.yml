name: Build Search Engine

on:
  workflow_call:
    inputs:
      cache_version:
        type: string
        default: '1'
      force_rebuild:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Serialize all core publishers, including runs with different dependency
    # hashes that share a MongoDB parent. PR validation has a separate group.
    concurrency:
      group: core-images-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.number || 'publish' }}
      cancel-in-progress: false
    env:
      CACHE_VERSION: ${{ inputs.cache_version }}
      FORCE_REBUILD: ${{ inputs.force_rebuild }}
      BUILD_JOBS: '2'
      PUBLISH_IMAGES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v6

      - name: Check build orchestration
        run: |
          python3 -m unittest discover -s tests/ci -v
          bash -n scripts/build-docker.sh scripts/verify-runtime.sh

      # The Docker driver can consume images loaded earlier in the same job.
      # The containerd store enables registry cache export with this driver.
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Log in to GHCR for publication
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare dependency images
        run: |
          if [ "$PUBLISH_IMAGES" = true ]; then
            python3 scripts/docker_images.py prepare --push
          else
            python3 scripts/docker_images.py prepare
          fi

      - name: Check public access to dependency images
        if: env.PUBLISH_IMAGES == 'true'
        run: python3 scripts/docker_images.py verify-public

      - name: Compile, run short tests and verify runtime
        run: python3 scripts/docker_images.py build

      - name: Publish verified core image
        if: env.PUBLISH_IMAGES == 'true'
        run: python3 scripts/docker_images.py publish

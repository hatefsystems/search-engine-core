name: Semantic icon engine
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  unit-and-offline-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/semantic-icon-engine/requirements.txt
      - name: Install runtime and test dependencies
        run: |
          pip install --require-hashes -r services/semantic-icon-engine/requirements.txt
          pip install pytest==8.3.4 httpx==0.28.1
      - name: Security, ingestion, API and vector tests
        run: pytest -q services/semantic-icon-engine/tests
      - name: Validate optional Compose profile
        run: |
          touch .env
          docker compose config -q
          docker compose --profile icons config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile icon-setup config -q
      - name: Build with synthetic catalog
        run: |
          python services/semantic-icon-engine/tests/make_smoke_catalog.py /tmp/icon-smoke/data
          chmod -R a+rX /tmp/icon-smoke
          docker build -t hatef-icons:test services/semantic-icon-engine
      - name: Offline, non-root, readonly container with resource ceilings
        run: |
          docker run -d --name hatef-icons-test --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --cpus 1 --memory 1536m --tmpfs /tmp:size=32m -v /tmp/icon-smoke:/artifacts:ro -e ICON_DATA_DIR=/artifacts/data hatef-icons:test
          for attempt in $(seq 1 30); do
            if docker exec hatef-icons-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"; then break; fi
            sleep 1
          done
          docker exec hatef-icons-test python -c "import json,urllib.request; r=urllib.request.Request('http://127.0.0.1:8080/v1/icons/suggest',data=json.dumps({'text':'زیرساخت ابری'}).encode(),headers={'Content-Type':'application/json'}); d=json.load(urllib.request.urlopen(r)); assert d['engine']=='lexical'; assert d['suggestions'][0]['id']=='lucide:cloud'; assert urllib.request.urlopen('http://127.0.0.1:8080/assets/icons/lucide/cloud.svg').status==200"
      - name: Start the Compose runtime against prepared artifacts
        env:
          ICON_ARTIFACT_DIR: /tmp/icon-smoke
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile icons up -d --build semantic-icon-engine
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T semantic-icon-engine python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"; then break; fi
            sleep 1
          done
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T semantic-icon-engine python -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health/ready')); assert d['mode']=='lexical' and d['icons']==2; assert urllib.request.urlopen('http://127.0.0.1:8080/assets/icons/lucide/cloud.svg').status==200"
      - name: Container diagnostics
        if: always()
        run: |
          docker logs hatef-icons-test || true
          docker compose logs semantic-icon-engine || true
      - name: Clean up
        if: always()
        run: |
          docker rm -f hatef-icons-test || true
          docker compose --profile icons rm -sf semantic-icon-engine || true
  full-model-offline:
    needs: unit-and-offline-container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: icon-images-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.number || 'publish' }}
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      ICON_ARTIFACT_DIR: /tmp/icon-full
      ICON_UPSTREAM_DIR: /tmp/icon-upstream
      PUBLISH_IMAGES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Restore complete artifacts for exactly these preparation inputs
        id: artifacts
        uses: actions/cache/restore@v4
        with:
          path: /tmp/icon-full
          key: icons-artifacts-v1-${{ runner.os }}-${{ hashFiles('services/semantic-icon-engine/config/**', 'services/semantic-icon-engine/licenses/**', 'services/semantic-icon-engine/app/text.py', 'services/semantic-icon-engine/app/svg.py', 'services/semantic-icon-engine/app/ingest.py', 'services/semantic-icon-engine/app/catalog.py', 'services/semantic-icon-engine/app/embeddings.py', 'services/semantic-icon-engine/scripts/manage.py', 'services/semantic-icon-engine/scripts/bootstrap.py', 'services/semantic-icon-engine/requirements.txt', 'services/semantic-icon-engine/Dockerfile') }}
      - name: Prepare pinned full catalog, model and vectors through Compose
        if: steps.artifacts.outputs.cache-hit != 'true'
        run: |
          touch .env
          sudo mkdir -p /tmp/icon-full /tmp/icon-upstream
          sudo chown -R 0:0 /tmp/icon-full /tmp/icon-upstream
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile icon-setup run --rm --build --no-deps icon-setup
          sha256sum /tmp/icon-full/vectors/shard-*.npy > /tmp/icon-vectors.sha256
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile icon-setup run --rm --no-deps icon-setup
          sha256sum --check /tmp/icon-vectors.sha256
      - name: Validate and stage only complete runtime artifacts
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile icon-setup run --rm --build --no-deps -v /tmp/icon-release:/release --entrypoint python icon-setup scripts/package.py
      - name: Build the complete release image once
        id: release-image
        uses: docker/build-push-action@v7
        with:
          context: ./services/semantic-icon-engine
          target: release
          build-contexts: icon-artifacts=/tmp/icon-release/package
          build-args: VCS_REF=${{ github.sha }}
          platforms: linux/amd64
          tags: hatef-icons:release-test
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=semantic-icons-release
          cache-to: type=gha,scope=semantic-icons-release,mode=max,ignore-error=true
      - name: Verify the loaded platform manifest against the build output
        env:
          EXPECTED_ICON_DIGEST: ${{ steps.release-image.outputs.digest }}
        run: python3 scripts/publish_icon_image.py --verify-only --expected-digest "$EXPECTED_ICON_DIGEST"
      - name: Test the bundled image without network or host artifacts
        run: |
          docker run -d --name hatef-icons-full --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --cpus 1 --memory 1536m --memory-swap 1536m --tmpfs /tmp:size=32m -v "$PWD/services/semantic-icon-engine/tests:/checks:ro" -e ICON_SEMANTIC_ENABLED=true hatef-icons:release-test
          mkdir -p build/icons
          cp /tmp/icon-full/import-report.json build/icons/import.json
          cp /tmp/icon-release/package/release.json build/icons/release.json
          docker exec hatef-icons-full python /checks/container_probe.py > build/icons/full-model-first.json
          docker restart hatef-icons-full
          docker exec hatef-icons-full python /checks/container_probe.py > build/icons/full-model-restart.json
          test "$(docker inspect -f '{{.State.OOMKilled}}' hatef-icons-full)" = false
          docker stop hatef-icons-full
      - name: Measure the frozen Persian 500-query benchmark (report only)
        run: |
          mkdir -p build/icons/benchmarks
          chmod 0777 build/icons/benchmarks
          docker run --rm --name hatef-icons-benchmark --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --cpus 1 --memory 1536m --memory-swap 1536m --tmpfs /tmp:size=32m -v "$PWD/services/semantic-icon-engine/tests:/checks:ro" -v "$PWD/build/icons/benchmarks:/results" hatef-icons:release-test python scripts/benchmark.py --data /opt/icon-artifacts/data --models /opt/icon-artifacts/models --vectors /opt/icon-artifacts/vectors --queries /checks/evaluation-fa-500.json --output /results/fa-500-hybrid-search.json
      - name: Deploy the same bundled image through production Compose
        env:
          ICON_ENGINE_IMAGE: hatef-icons:release-test
          ICON_SEMANTIC_ENABLED: 'true'
        run: |
          docker compose --profile icons up -d --no-build --pull never semantic-icon-engine
          id=$(docker compose ps -q semantic-icon-engine)
          python3 -c "import json,pathlib; root=pathlib.Path('services/semantic-icon-engine/tests'); print(json.dumps({name:(root/name).read_text() for name in ['container_probe.py','evaluation.json']}))" > /tmp/icon-probe.json
          docker exec -i "$id" python -c "import json,sys,pathlib; root=pathlib.Path('/tmp/checks'); root.mkdir(); [(root/name).write_text(body) for name,body in json.load(sys.stdin).items()]" < /tmp/icon-probe.json
          docker exec "$id" python /tmp/checks/container_probe.py > build/icons/compose.json
          docker compose --profile icons stop semantic-icon-engine
      - name: Save validated preparation artifacts on trusted master only
        if: env.PUBLISH_IMAGES == 'true' && steps.artifacts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/icon-full
          key: ${{ steps.artifacts.outputs.cache-primary-key }}
      - name: Log in to GHCR after all image tests pass
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image without rebuilding
        if: env.PUBLISH_IMAGES == 'true'
        env:
          EXPECTED_ICON_DIGEST: ${{ steps.release-image.outputs.digest }}
        run: python3 scripts/publish_icon_image.py --expected-digest "$EXPECTED_ICON_DIGEST"
      - name: Capture runtime diagnostics
        if: always()
        run: |
          mkdir -p build/icons
          docker inspect hatef-icons-full > build/icons/container.json || true
          docker logs hatef-icons-full > build/icons/container.log 2>&1 || true
          docker compose logs semantic-icon-engine > build/icons/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-icons-full-model-offline
          path: build/icons
          retention-days: 14
      - name: Remove test containers
        if: always()
        run: |
          docker rm -f hatef-icons-full hatef-icons-benchmark || true
          docker compose --profile icons rm -sf semantic-icon-engine || true
